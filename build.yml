name: Build VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux-Abhängigkeiten installieren
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Konfigurieren (macOS, universal)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Konfigurieren (Windows, Linux)
        if: runner.os != 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Bauen
        run: cmake --build build --config Release --parallel

      - name: VST3 einsammeln
        shell: bash
        run: |
          mkdir -p out
          find build -name "*.vst3" -prune -exec cp -R {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: SynthVisualizer-${{ matrix.name }}
          path: out
